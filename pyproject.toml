[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vigi-nvr-mcp"
version = "0.1.0"
description = "Local, browser-free MCP server for TP-Link VIGI NVRs (read-first, write-gated, lockout-aware)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ebenezer Isaac" }]
keywords = ["mcp", "tp-link", "vigi", "nvr", "cctv"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
  # FastMCP lives at mcp.server.fastmcp in the 1.x line; 2.x renamed it.
  "mcp>=1.12,<2",
  "httpx>=0.27,<1",
  "cryptography>=42",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0",
  # IANA tz database for zoneinfo on platforms without a system copy (Windows, slim
  # containers); used by nvr_list_recording_segments / nvr_list_motion_windows tz.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.5",
]

[project.scripts]
vigi-nvr-mcp = "vigi_nvr_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vigi_nvr_mcp"]

[tool.hatch.build.targets.sdist]
include = ["vigi_nvr_mcp", "tests", "scripts", "README.md", "LICENSE", ".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["vigi_nvr_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S324", "S505"]
"scripts/**" = ["S603", "S607"]
